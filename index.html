<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>world.execute(me); — bilingual edition</title>
  <link rel="stylesheet" href="lyrics.css">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05060a; }
    body { display: grid; place-items: center; }
    #stage { position: relative; width: min(100vw, 177.77778vh); height: min(100vh, 56.25vw); overflow: hidden; }
    #c { display: block; width: 100%; height: 100%; }
    #soundPrompt {
      position: absolute; right: 18px; bottom: 18px; z-index: 4;
      padding: 9px 12px; border: 1px solid #315061; border-radius: 5px;
      background: #071119d9; color: #dce7f2; font: 12px ui-monospace, Consolas, monospace;
      cursor: pointer;
    }
    #soundPrompt[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="c" width="1920" height="1080" aria-label="world.execute(me); 动态壁纸"></canvas>
    <div id="lyricLayer" hidden aria-label="同步中英歌词">
      <div id="lyricDesign">
        <div id="lyricCard">
          <div class="lyric-number" id="lyricIndex"></div>
          <div class="lyric-block lyric-en">
            <span class="lyric-label">ENGLISH</span>
            <span class="lyric-text" id="lyricEnglish"></span>
          </div>
          <div class="lyric-divider"></div>
          <div class="lyric-block lyric-zh">
            <span class="lyric-label">中文</span>
            <span class="lyric-text" id="lyricChinese"></span>
          </div>
          <div class="lyric-track"><div id="lyricProgress"></div></div>
        </div>
      </div>
    </div>
    <button id="soundPrompt" type="button" hidden>选择本地音乐</button>
    <input id="songPicker" type="file" accept="audio/*,.mp3" hidden>
  </div>
  <audio id="song" src="song.mp3" preload="auto" loop></audio>
  <script src="analysis.js"></script>
  <script src="events.js"></script>
  <script src="common.js"></script>
  <script src="scenes2.js"></script>
  <script src="lyrics-data.js"></script>
  <script src="lyrics.js"></script>
  <script src="wallpaper.js"></script>
</body>
</html>
